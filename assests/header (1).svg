<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 150" width="760" height="150" role="img" aria-label="Bhudev Bhanpuriya, backend engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .dim{ fill:#6e7681; }
    .grn{ fill:#3fb950; }
    .txt{ fill:#adbac7; }
    .cy { fill:#539bf5; }
  </style>

  <defs>
    <clipPath id="reveal">
      <rect x="34" y="44" width="0" height="50">
        <animate attributeName="width" from="0" to="356" dur="1.6s" begin="0.4s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <text class="m dim" x="2" y="26" font-size="13">~/github/bhudevbhanpuriya  ·  main</text>

  <text class="m grn" x="2" y="82" font-size="30">$</text>
  <g clip-path="url(#reveal)">
    <text class="m txt" x="34" y="82" font-size="30" letter-spacing="1">Bhudev Bhanpuriya</text>
  </g>

  <rect x="34" y="58" width="14" height="30" fill="#3fb950">
    <animate attributeName="x" from="34" to="390" dur="1.6s" begin="0.4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="1.2s" begin="2.1s" repeatCount="indefinite"/>
  </rect>

  <text class="m cy" x="2" y="124" font-size="14" opacity="0">backend engineer &#183; distributed systems &#183; go
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.0s" fill="freeze"/>
  </text>
</svg>
